# Builds, signs and publishes Ember when a version tag is pushed:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The release opens as a draft; publishing it is the final manual step.
# The workflow attaches the installer, the updater payload, its signature and
# latest.json — the manifest installed copies of Ember poll for updates.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ember ${{ github.ref_name }}"
          releaseBody: |
            # Ember ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/sanirudh17/Ember/blob/main/CHANGELOG.md) for everything that changed in this release.

            ## Installation & updates

            - Download the `Ember_*_x64-setup.exe` asset below and run it. Windows SmartScreen may warn because the installer is not code-signed — click **More info → Run anyway**.
            - Installed copies of Ember update themselves: the app checks this repository's `latest.json` at launch and every few hours, verifies the build's signature, and installs it in place.
          releaseDraft: true
          prerelease: false
